<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little League Defensive Lineup Tracker</title>
    <style>
        :root {
            --orange-bg: #f59e0b;
            --dirt-color: #555555;
            --grass-color: #ffffff;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--orange-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
            font-size: 28px;
            text-align: center;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .btn {
            background-color: white;
            color: var(--orange-bg);
            border: none;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #inning-text {
            font-size: 24px;
            font-weight: bold;
            color: white;
            min-width: 240px;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .field-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            aspect-ratio: 1440 / 1080;
            background-image: url('https://docs.google.com/drawings/d/e/2PACX-1vS6Suu_uCGk_D68V_59HI_Z-17RyuL9ZnP_ghzmF8eplc4Ydt8CKMapU6uXjOBDUMkATyUtmJ-Ik5o4/pub?w=1440&h=1080');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--orange-bg);
        }

        .player-label {
            position: absolute;
            font-weight: bold;
            font-size: 2.3vw;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        @media (min-width: 850px) {
            .player-label {
                font-size: 20px;
            }
        }

        /* Dark grey text optimized for clear dirt visibility */
        .dirt-pos {
            color: var(--dirt-color);
        }

        /* Bright white text with a high-contrast outline drop shadow for grass visibility */
        .grass-pos {
            color: var(--grass-color);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8), -1px -1px 3px rgba(0,0,0,0.8), 1px -1px 3px rgba(0,0,0,0.8), -1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Adjusted coordinate alignment to center names completely away from lines */
        #pos-C   { left: 50.0%; top: 94.5%; }
        #pos-P   { left: 50.0%; top: 61.0%; }
        #pos-3B  { left: 37.5%; top: 52.0%; }
        #pos-1B  { left: 63.5%; top: 52.0%; }
        #pos-SS  { left: 45.5%; top: 37.5%; }
        #pos-2B  { left: 57.5%; top: 37.5%; }
        #pos-LF  { left: 26.0%; top: 38.5%; }
        #pos-LCF { left: 37.5%; top: 21.5%; }
        #pos-RCF { left: 66.5%; top: 21.5%; }
        #pos-RF  { left: 79.5%; top: 38.5%; }

        .dugout-container {
            margin-top: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 850px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .dugout-title {
            font-weight: bold;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        #bench-list {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 18px;
            font-weight: bold;
        }

        .bench-player {
            background: #fef3c7;
            color: #d97706;
            padding: 8px 20px;
            border-radius: 24px;
            border: 1px solid #fde68a;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>Tigers Lineup</h1>

    <div class="controls">
        <button class="btn" onclick="updateInning(-1)">&#10094;</button>
        <span id="inning-text">Syncing Roster...</span>
        <button class="btn" onclick="updateInning(1)">&#10095;</button>
    </div>

    <div class="field-container">
        <div id="pos-C" class="player-label dirt-pos"></div>
        <div id="pos-P" class="player-label dirt-pos"></div>
        <div id="pos-3B" class="player-label dirt-pos"></div>
        <div id="pos-1B" class="player-label dirt-pos"></div>
        <div id="pos-SS" class="player-label dirt-pos"></div>
        <div id="pos-2B" class="player-label dirt-pos"></div>

        <div id="pos-LF" class="player-label grass-pos"></div>
        <div id="pos-LCF" class="player-label grass-pos"></div>
        <div id="pos-RCF" class="player-label grass-pos"></div>
        <div id="pos-RF" class="player-label grass-pos"></div>
    </div>

    <div class="dugout-container">
        <div class="dugout-title">Dugout</div>
        <div id="bench-list"></div>
    </div>

    <script>
        const gameData = {};
        let currentInning = 1;

        function parseCSV(csvText) {
            // Split into rows and clean up cell contents
            const rows = csvText.split(/\r?\n/).map(row => {
                return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                          .map(cell => cell.replace(/^"|"$/g, '').trim());
            }).filter(row => row.length > 0 && row.some(cell => cell !== ""));

            if (rows.length === 0) return;

            // Prepare blank template structure for all 6 innings
            for (let i = 1; i <= 6; i++) {
                gameData[i] = { P:'', C:'', '1B':'', '2B':'', SS:'', '3B':'', LF:'', LCF:'', RCF:'', RF:'', bench:[] };
            }

            const header = rows[0];
            
            // 1. Identify where the 'Pos' position row header column is located
            const posColIdx = header.findIndex(h => h.toLowerCase().trim() === 'pos' || h.toLowerCase().trim() === 'position');
            
            // 2. Map out columns matching "1st Inning", "2nd Inning", etc.
            const inningCols = {};
            for (let i = 1; i <= 6; i++) {
                inningCols[i] = header.findIndex(h => {
                    const clean = h.toLowerCase().replace(/\s+/g, '');
                    return clean.includes(`${i}st`) || clean.includes(`${i}nd`) || clean.includes(`${i}rd`) || clean.includes(`${i}th`) || clean === `inning${i}` || clean === `${i}`;
                });
            }

            // 3. Process every spreadsheet row to extract names matching positions
            for (let r = 1; r < rows.length; r++) {
                const row = rows[r];
                if (posColIdx === -1 || !row[posColIdx]) continue;
                
                let pos = row[posColIdx].toUpperCase().trim();
                
                // Translate your spreadsheet's short outfield notation to match field overlay names
                if (pos === 'LC') pos = 'LCF';
                if (pos === 'RC') pos = 'RCF';

                // Look across the row to find who plays this position for each inning
                for (let i = 1; i <= 6; i++) {
                    const colIdx = inningCols[i];
                    if (colIdx !== -1 && row[colIdx]) {
                        const playerName = row[colIdx].trim();
                        if (!playerName) continue;

                        if (['BENCH', 'DUGOUT', 'SITTING', 'OUT'].includes(pos)) {
                            gameData[i].bench.push(playerName);
                        } else {
                            gameData[i][pos] = playerName;
                        }
                    }
                }
            }

            renderPositions();
        }

        async function fetchSpreadsheetData() {
            const cacheBuster = '&t=' + new Date().getTime();
            const googleSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0m8_RCfjBOeqFI4FcO04rtslrUchD7nvmY4D173Zp33_msEargr-DoaU1anfRBjblJdhvL7py5YZZ/pub?gid=779550576&single=true&output=csv' + cacheBuster;
            
            try {
                const response = await fetch(googleSheetUrl);
                if (!response.ok) throw new Error('Network error');
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error("Data Fetch Exception:", error);
                document.getElementById('inning-text').innerText = "Connection Error";
            }
        }

        function updateInning(direction) {
            currentInning += direction;
            if (currentInning < 1) currentInning = 1;
            if (currentInning > 6) currentInning = 6;
            renderPositions();
        }

        function renderPositions() {
            if (!gameData[currentInning]) return;
            
            document.getElementById('inning-text').innerText = `Inning ${currentInning}`;
            const data = gameData[currentInning];

            // Assign layout text to elements
            document.getElementById('pos-P').innerText = data.P || '';
            document.getElementById('pos-C').innerText = data.C || '';
            document.getElementById('pos-1B').innerText = data["1B"] || '';
            document.getElementById('pos-2B').innerText = data["2B"] || '';
            document.getElementById('pos-SS').innerText = data.SS || '';
            document.getElementById('pos-3B').innerText = data["3B"] || '';
            document.getElementById('pos-LF').innerText = data.LF || '';
            document.getElementById('pos-LCF').innerText = data.LCF || '';
            document.getElementById('pos-RCF').innerText = data.RCF || '';
            document.getElementById('pos-RF').innerText = data.RF || '';
            
            // Build dugout badges
            const benchContainer = document.getElementById('bench-list');
            benchContainer.innerHTML = '';
            
            if (data.bench && data.bench.length > 0) {
                data.bench.forEach(player => {
                    const span = document.createElement('span');
                    span.className = 'bench-player';
                    span.innerText = player;
                    benchContainer.appendChild(span);
                });
            } else {
                benchContainer.innerHTML = '<span style="color:#999; font-style:italic; font-size:16px;">Empty</span>';
            }
        }

        window.onload = fetchSpreadsheetData;
    </script>
</body>
</html>
